name: aoc
version: 0.0.1

ghc-options: -Wall
language: GHC2021

library:
  source-dirs: lib
  dependencies:
    - base

executables:
  aoc:
    main: Main.hs
    source-dirs: app
    dependencies:
      - aoc
      - base
      - bytestring
      - ghc
      - ghc-paths
      - ghc-source-gen
      - http-conduit
      - optparse-applicative
      - utf8-string

tests:
  spec:
    defaults: hspec/hspec@main
    dependencies:
      - aoc
      - base
      - hspec
